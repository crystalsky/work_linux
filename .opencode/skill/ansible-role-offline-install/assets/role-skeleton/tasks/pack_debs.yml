---
# =============================================================================
# 打包前准备：deb 形态离线包
# =============================================================================
# 只在 xxx_offline_format == 'deb' 时被基座通过 _install_prepack_tasks 调用。
#
# 为什么不能直接 `apt-get install --download-only <包>`：
#   1. 很多包名只是元包（几 KB 的壳），真身在依赖里
#   2. 依赖已满足时 apt 不会展开闭包，只会下到那个空壳
#   3. apt 默认把包落在 /var/cache/apt/archives，路径不受控
#
# 做法：取本机「已安装的相关包」真实包名，再 apt-get download 到暂存目录。
# =============================================================================

- name: "[{{ install_pkg_name }}] pack —— 等待 dpkg 锁释放"
  ansible.builtin.include_tasks: "{{ install_base_tasks_dir }}/wait_pkg_lock.yml"

- name: "[{{ install_pkg_name }}] pack —— 清理并重建下载目录"
  ansible.builtin.file:
    path: "{{ xxx_deb_download_dir }}"
    state: "{{ item }}"
    mode: "0755"
  loop:
    - absent
    - directory

- name: "[{{ install_pkg_name }}] pack —— 取本机已安装的相关包真实名"
  ansible.builtin.shell: |
    set -u
    dpkg-query -W -f='${Package}\n' 2>/dev/null \
      | grep -E '<包名前缀正则>' \
      | sed 's/:.*//' \
      | sort -u || true
  args:
    executable: /bin/bash
  register: _xxx_installed_pkgs
  changed_when: false
  failed_when: false

- name: "[{{ install_pkg_name }}] pack —— 合并期望包清单"
  ansible.builtin.set_fact:
    _xxx_real_pkg_names: >-
      {{ (_xxx_installed_pkgs.stdout_lines | default([])
          + xxx_apt_packages)
         | map('regex_replace', ':.*$', '')
         | unique }}

- name: "[{{ install_pkg_name }}] pack —— 包清单不能为空"
  ansible.builtin.assert:
    that:
      - _xxx_real_pkg_names | length > 0
    fail_msg: >-
      未解析到任何可下载的包名，请检查 <包名前缀正则> 与 xxx_apt_packages
    quiet: true

- name: "[{{ install_pkg_name }}] pack —— 下载 .deb 集合"
  ansible.builtin.shell: |
    set -eu
    cd "{{ xxx_deb_download_dir }}"
    apt-get download {{ _xxx_real_pkg_names | join(' ') }}
    ls -1 *.deb | sort > <xxx>-deps.txt
    echo "count=$(ls -1 *.deb | wc -l)"
    echo "size=$(du -sh . | awk '{print $1}')"
  args:
    executable: /bin/bash
  register: _xxx_deb_download
  changed_when: true
  retries: 3
  delay: 10
  until: _xxx_deb_download is succeeded

- name: "[{{ install_pkg_name }}] pack —— 至少下载到 1 个 .deb"
  ansible.builtin.assert:
    that:
      - (_xxx_deb_download.stdout | regex_findall('count=(\d+)') | first | default('0', true) | int) > 0
    fail_msg: "apt-get download 未产生任何 .deb"
    quiet: true

- name: "[{{ install_pkg_name }}] pack —— 下载结果"
  ansible.builtin.debug:
    msg: "{{ _xxx_deb_download.stdout_lines }}"
