# sccache 配置模板（用户级）
#
# 用法二选一：
#   A) 复制为默认路径，对所有 shell 生效：
#        install -Dm644 scripts/devops/sccache-config.toml ~/.config/sccache/config
#   B) 不改默认路径，仅对当前 shell 生效：
#        export SCCACHE_CONF="$PWD/scripts/devops/sccache-config.toml"
#
# 注意：环境变量优先级高于本文件，两者同时存在时以环境变量为准。
# 详细说明见 docs/devops_sccache/20261022-sccache-config-manual.md

# ---------------------------------------------------------------------------
# 多级缓存：L0 本地磁盘（快）→ L1 Redis（跨机共享）
# 命中 L1 时会自动回填 L0，下次同机编译走本地磁盘，减少网络往返。
# 不需要多级时，删除本节即为单级（此时由 [cache.redis] 生效）。
# ---------------------------------------------------------------------------
[cache.multilevel]
chain = ["disk", "redis"]
# 写入失败策略：ignore / l0（默认）/ all
# l0 = 只有 L0 写失败才算构建失败；L1(Redis) 抖动不会中断编译
write_error_policy = "l0"

# ---------------------------------------------------------------------------
# L0：本地磁盘
# ---------------------------------------------------------------------------
[cache.disk]
dir = "/home/vire/.cache/sccache"
size = 10737418240  # 10 GiB

# ---------------------------------------------------------------------------
# L1：Redis（本机容器 deploy_release-redis-1，宿主端口 36379）
#
# 该实例同时被业务栈使用（db0 = celery 等），因此这里：
#   - 用 db = 1 与业务数据隔离
#   - 用 key_prefix 二次隔离，便于按前缀清理
#   - 设置 expiration，避免在 noeviction + 无 maxmemory 的实例上无限增长
# ---------------------------------------------------------------------------
[cache.redis]
endpoint = "redis://127.0.0.1:36379"
db = 1
key_prefix = "sccache/"
expiration = 2592000  # 30 天，单位秒；不设置则永不过期