[defaults]
# 清单文件：按官方样板分为 production / staging 两套
# 默认走 staging（本地沙箱容器），生产用 -i inventory/production/hosts.yml 显式覆盖
inventory = ./inventory/staging/hosts.yml
roles_path = ./roles
# galaxy 依赖安装在项目内 collections/ 目录，需显式声明
collections_path = ./collections:~/.ansible/collections:/usr/share/ansible/collections
library = ./library
filter_plugins = ./filter_plugins
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
deprecation_warnings = False
# 连接参数由 group_vars 提供，这里只设定超时
timeout = 30

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# 沙箱镜像为密码登录，需依赖 sshpass
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=password -o PubkeyAuthentication=no
