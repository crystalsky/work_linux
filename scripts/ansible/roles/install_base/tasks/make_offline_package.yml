---
# =============================================================================
# 制作离线包 —— 流程 2
# =============================================================================
# 前提：软件已经通过在线方式装好（由 role 的 online_install.yml 完成）。
# 本片段负责把「安装产物」打成 tar.gz，并生成 manifest / checksum。
#
# role 需要设置：
#   _install_pack_sources : 要打包的路径列表（绝对路径），如
#                           ['/home/linuxbrew/.linuxbrew', '/etc/profile.d/brew.sh']
#   _install_pack_exclude : 打包排除的 pattern 列表（可选）
#
# 产出：
#   _install_built_package : 控制端/目标机上生成的 tar.gz 绝对路径
# =============================================================================

- name: 打包 —— 校验待打包路径是否存在
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ _install_pack_sources }}"
  register: _install_pack_src_stat
  become: true
  tags: [install_base]

- name: 打包 —— 存在缺失路径则失败
  ansible.builtin.fail:
    msg: >-
      待打包路径不存在：{{ item.item }}。
      离线包制作的前提是软件已在线安装成功，请先确认 online_install 已完成。
  loop: "{{ _install_pack_src_stat.results }}"
  when: not item.stat.exists
  tags: [install_base]

- name: 打包 —— 准备构建目录
  ansible.builtin.file:
    path: "{{ _install_pkg_workdir }}"
    state: "{{ item }}"
    mode: "0755"
  loop:
    - absent
    - directory
  become: true
  tags: [install_base]

# -----------------------------------------------------------------------------
# 自包含离线安装脚本
#   把 install-offline.sh 渲染到包构建目录，随 tar 一起进包。
#   解包后即见 install-offline.sh，无需 Ansible 也能装。
# -----------------------------------------------------------------------------
- name: 打包 —— 创建脚本暂存目录
  ansible.builtin.file:
    path: "{{ _install_pkg_workdir }}/.installer"
    state: directory
    mode: "0755"
  become: true
  when: install_base_embed_installer | bool
  tags: [install_base]

- name: 打包 —— 渲染自包含离线安装脚本
  ansible.builtin.template:
    src: "{{ install_base_role_dir }}/templates/offline-install.sh.j2"
    dest: "{{ _install_pkg_workdir }}/.installer/{{ offline_installer_name }}"
    mode: "0755"
  vars:
    _offline_build_time: "{{ '%Y-%m-%dT%H:%M:%SZ' | strftime(utc=True) }}"
    _offline_build_distro: "{{ install_base_facts.os_distribution }}"
    _offline_build_distro_version: "{{ install_base_facts.os_release }}"
    _offline_build_arch: "{{ install_base_facts.arch }}"
  become: true
  when: install_base_embed_installer | bool
  tags: [install_base]

# role 可以自带预渲染的附属文件（如 wrapper、profile.d），
# 通过 _offline_extra_pack_dirs 指定目录，整目录拷进包的 .installer/ 下。
- name: 打包 —— 合并 role 自带的包内附件
  ansible.builtin.shell: |
    set -euo pipefail
    SRC="{{ _offline_extra_pack_dirs }}"
    [ -d "$SRC" ] || { echo "skip"; exit 0; }
    cp -a "$SRC"/. "{{ _install_pkg_workdir }}/.installer"/
    find "{{ _install_pkg_workdir }}/.installer" -type f | wc -l
  args:
    executable: /bin/bash
  register: _install_extra_files
  changed_when: _install_extra_files.stdout | trim != 'skip'
  when:
    - install_base_embed_installer | bool
    - _offline_extra_pack_dirs | default('') | length > 0
  tags: [install_base]

- name: 打包 —— 校验渲染后的脚本语法
  ansible.builtin.command:
    argv: [bash, -n, "{{ _install_pkg_workdir }}/.installer/{{ offline_installer_name }}"]
  register: _install_script_syntax
  changed_when: false
  when: install_base_embed_installer | bool
  tags: [install_base]

- name: 打包 —— 脚本语法错误则中止
  ansible.builtin.fail:
    msg: >-
      渲染出的离线安装脚本存在语法错误，不能打进包：
      {{ _install_script_syntax.stderr | default('') }}
  when:
    - install_base_embed_installer | bool
    - _install_script_syntax.rc | default(0) != 0
  tags: [install_base]

- name: 打包 —— 生成 manifest 文件
  ansible.builtin.copy:
    dest: "{{ _install_pkg_workdir }}/MANIFEST.txt"
    mode: "0644"
    content: |
      pkg              : {{ install_pkg_name }}
      version          : {{ install_pkg_version | default('unknown') }}
      built_at         : {{ '%Y-%m-%dT%H:%M:%SZ' | strftime(utc=True) }}
      built_on_host    : {{ inventory_hostname }}
      os_distribution  : {{ install_base_facts.os_distribution }}
      os_release       : {{ install_base_facts.os_release }}
      arch             : {{ install_base_facts.arch }}
      bundled_paths    :
      {% for p in _install_pack_sources %}
        - {{ p }}
      {% endfor %}
      installer        : {{ offline_installer_name if install_base_embed_installer | bool else 'not-embedded' }}
      install_methods  :
        - ansible-playbook -e install_mode=offline -e offline_package_path=...
        - tar -xzf this-package -C /tmp/pkg && sudo /tmp/pkg/{{ offline_installer_name }}
  become: true
  tags: [install_base]

- name: 打包 —— 归档安装产物
  ansible.builtin.shell: |
    set -euo pipefail
    cd /
    PKG="{{ _install_pkg_workdir }}/{{ _install_pkg_basename }}"
    rm -f "$PKG"
    # 排除项与源路径必须拼在同一条命令里；Jinja 的 for 循环会吃掉换行，
    # 导致 tar 参数列表和后续 tar -tzf 粘成一条命令（报
    # "You may not specify more than one '-Acdtrux'"）。
    # 因此这里先把参数拼进数组，再一次性执行。
    EXCLUDES=(
    {% for p in _install_pack_exclude | default([]) %}
      --exclude={{ p | quote }}
    {% endfor %}
    )
    SOURCES=(
    {% for p in _install_pack_sources %}
      {{ p | regex_replace('^/', '') | quote }}
    {% endfor %}
    {% if install_base_embed_installer | bool %}
      -C "{{ _install_pkg_workdir }}/.installer" ./
    {% endif %}
    )
    tar -czf "$PKG" "${EXCLUDES[@]}" "${SOURCES[@]}"
    tar -tzf "$PKG" | wc -l
  args:
    executable: /bin/bash
    chdir: /
  register: _install_pack_result
  become: true
  changed_when: true
  tags: [install_base]

- name: 打包 —— 计算包校验值
  ansible.builtin.stat:
    path: "{{ _install_pkg_workdir }}/{{ _install_pkg_basename }}"
    checksum_algorithm: "{{ install_base_checksum_algo }}"
    get_checksum: true
  register: _install_built_stat
  become: true
  tags: [install_base]

# 注意：dest 一旦用 >- 折叠，YAML 会把后面的 mode 也粘进字符串，
# 生成名为 "xxx.tar.gz.sha256  mode: 0644" 的怪文件。
# 这里改用 vars 预拼路径，既避免折叠又控制行长。
- name: 打包 —— 写出校验文件
  ansible.builtin.copy:
    dest: "{{ _install_checksum_file }}"
    mode: "0644"
    content: |
      {{ _install_built_stat.stat.checksum }}  {{ _install_pkg_basename }}
  vars:
    _install_checksum_file: >-
      {{ _install_pkg_workdir ~ '/' ~ _install_pkg_basename ~ '.' ~ install_base_checksum_algo }}
  become: true
  tags: [install_base]

- name: 打包 —— 记录产物路径
  ansible.builtin.set_fact:
    _install_built_package: "{{ _install_pkg_workdir }}/{{ _install_pkg_basename }}"
  tags: [install_base]

- name: 打包 —— 输出产物信息
  ansible.builtin.debug:
    msg:
      - "[{{ install_pkg_name }}] 离线包已生成"
      - "  路径   : {{ _install_built_package }}"
      - "  大小   : {{ (_install_built_stat.stat.size / 1024 / 1024) | round(2) }} MB"
      - "  归档条目: {{ _install_pack_result.stdout_lines | last | default('?') }}"
      - "  {{ install_base_checksum_algo }}   : {{ _install_built_stat.stat.checksum }}"
  tags: [install_base]
