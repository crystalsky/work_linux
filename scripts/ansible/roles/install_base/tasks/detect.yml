---
# =============================================================================
# 状态探测 —— 只读，绝不修改任何文件
# =============================================================================
# 由各 install_<pkg> role 提供自己的探测脚本，本片段只负责：
#   1. 调用探测命令（由 role 通过 _install_probe_cmd 传入）
#   2. 读取历史状态标记
#   3. 汇总成 install_state
#
# role 需要在 include 之前设置：
#   _install_probe_cmd     : 返回 0 表示已安装的只读命令
#                            （如 "brew --version" / "test -x /usr/local/bin/ruby"）
#   _install_declared_version : 该 role 期望的版本号
#
# 产出：
#   install_state         : absent | partial | drift | ok
#   install_state_detail  : 人类可读的判定依据
#   install_existing_version : 探测到的现有版本（探测失败时为 ""）
# =============================================================================

- name: 探测 —— 运行只读探测命令
  ansible.builtin.command: "{{ _install_probe_cmd }}"
  args:
    chdir: /tmp
  register: _install_probe_result
  changed_when: false
  failed_when: false
  become: "{{ _install_probe_become | default(false) }}"
  tags: [install_base]

- name: 探测 —— 读取历史状态标记
  ansible.builtin.stat:
    path: "{{ _install_pkg_state_file }}"
  register: _install_state_stat
  tags: [install_base]

- name: 探测 —— 判定安装状态
  ansible.builtin.set_fact:
    install_state: >-
      {{ 'absent'
         if _install_probe_result.rc != 0
         else ('ok' if (_install_state_stat.stat.exists | default(false)) else 'partial') }}
    install_state_detail: >-
      {{ ('未检测到 ' ~ install_pkg_name ~ '（探测命令 rc=' ~ _install_probe_result.rc ~ '）')
         if _install_probe_result.rc != 0
         else (('已安装且状态标记完整：' ~ _install_pkg_state_file)
               if (_install_state_stat.stat.exists | default(false))
               else ('已检测到 ' ~ install_pkg_name
                     ~ ' 但缺少状态标记，视为不完整安装')) }}
  tags: [install_base]

- name: 探测 —— 输出判定结果
  ansible.builtin.debug:
    msg: >-
      [{{ install_pkg_name }}] 状态 = {{ install_state }} ｜ {{ install_state_detail }}
  tags: [install_base]
