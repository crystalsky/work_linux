---
# =============================================================================
# install_nodejs —— 打包前准备：随包携带系统运行库包
# =============================================================================
# node 二进制依赖 libstdc++6 等系统库。全新容器（尤其精简镜像）里可能缺失，
# 纯离线环境又无法补装，因此这里把依赖闭包的包文件一并打进离线包。
#
# 依赖收集统一由 install_base/tasks/collect_deps.yml 完成：
#   apt 系 → apt-cache depends --recurse + apt-get download（.deb）
#   dnf 系 → dnf repoquery --recursive + dnf download（.rpm）
# =============================================================================

- name: "[{{ install_pkg_name }}] 打包准备 —— 按发行版挑选运行库包名"
  ansible.builtin.set_fact:
    _nodejs_runtime_pkgs: >-
      {{ nodejs_runtime_packages if install_base_facts.pkg_mgr == 'apt'
         else nodejs_runtime_packages_dnf }}

- name: "[{{ install_pkg_name }}] 打包准备 —— 收集运行库包文件"
  ansible.builtin.include_tasks: "{{ install_base_tasks_dir }}/collect_deps.yml"
  vars:
    _dep_pkg_names: "{{ _nodejs_runtime_pkgs }}"
    _dep_download_dir: "{{ nodejs_runtime_deb_dir }}"
  when: nodejs_offline_include_runtime_debs | bool

- name: "[{{ install_pkg_name }}] 打包准备 —— 输出运行库明细"
  ansible.builtin.debug:
    msg: >-
      {{ '离线包不携带运行库' if not (nodejs_offline_include_runtime_debs | bool)
         else '运行库已收集：' ~ (_dep_result.summary | default('未收集')) }}
