---
# =============================================================================
# install_nodejs —— 解析已安装的版本目录
# =============================================================================
# 产出：
#   _nodejs_ver  形如 v22.23.3（目录名）
#   _nodejs_dir  nvm 版本目录的绝对路径
#
# 用途：
#   _install_pack_sources 需要一个精确到"单个版本"的路径，
#   否则会把 nvm 下所有 node 版本一起打进同一个离线包。
# =============================================================================

- name: "[{{ install_pkg_name }}] 解析版本 —— 在 nvm 版本目录中查找"
  ansible.builtin.shell: |
    set -u
    HIT="$(ls -d "{{ nvm_prefix }}/versions/node/v{{ nodejs_major_version }}."* \
           2>/dev/null | sort -V | tail -1)"
    if [ -n "$HIT" ] && [ -d "$HIT" ]; then
      echo "dir=$HIT"
      echo "ver=$(basename "$HIT")"
    else
      echo "dir="
      echo "ver="
    fi
  args:
    executable: /bin/bash
  register: _nodejs_resolve_installed
  changed_when: false

- name: "[{{ install_pkg_name }}] 解析版本 —— 记录结果"
  ansible.builtin.set_fact:
    _nodejs_dir: >-
      {{ (_nodejs_resolve_installed.stdout | regex_findall('dir=([^\n]+)') | first
          | default('', true)) }}
    _nodejs_ver: >-
      {{ (_nodejs_resolve_installed.stdout | regex_findall('ver=([^\n]+)') | first
          | default('', true)) }}

- name: "[{{ install_pkg_name }}] 解析版本 —— 未找到则中止"
  ansible.builtin.assert:
    that:
      - _nodejs_ver | length > 0
    fail_msg: >-
      未在 {{ nvm_prefix }}/versions/node 下找到 v{{ nodejs_major_version }}.* 目录。
      打包前请先完成在线安装。
    quiet: true

- name: "[{{ install_pkg_name }}] 解析版本 —— 输出"
  ansible.builtin.debug:
    msg: "版本目录 = {{ _nodejs_dir }}"
