---
galaxy_info:
  role_name: install_homebrew
  author: work_linux
  description: 通过 install_base 双模式安装 Homebrew（Linuxbrew）
  license: MIT
  min_ansible_version: "2.18"
  platforms:
    - name: Debian
      versions:
        - trixie
  galaxy_tags:
    - homebrew
    - linuxbrew
