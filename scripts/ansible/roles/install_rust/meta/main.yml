---
galaxy_info:
  role_name: install_rust
  author: work_linux
  description: 通过 install_base 双模式安装 Rust 工具链（在线 rustup / 离线 tar.gz）
  license: MIT
  min_ansible_version: "2.18"
  platforms:
    - name: Debian
      versions:
        - trixie
    - name: Ubuntu
      versions:
        - focal
  galaxy_tags:
    - rust
    - cargo
    - rustup
    - install

# install_base 由本 role 的 tasks/main.yml 直接 include，
# 不在此声明为依赖，避免被依赖时重复执行初始化流程。
dependencies: []
