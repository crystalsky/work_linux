---
# =============================================================================
# install_nvm —— 在线安装
# =============================================================================
# nvm 是纯 shell 脚本实现，无需编译：
#   1. 下载 GitHub release 源码快照（v0.40.8.tar.gz）
#   2. 解压后得到 nvm-0.40.8/ 目录
#   3. 整体搬到 nvm_prefix（/opt/nvm）
#   4. 写 /etc/profile.d/nvm.sh 暴露给所有用户
#
# 不走官方 install.sh 的原因：
#   官方脚本默认装到 $HOME/.nvm（单用户），且会改写 ~/.bashrc；
#   本 role 需要多用户共享 + 不动用户家目录配置，因此直接解压部署。
# =============================================================================

- name: "[{{ install_pkg_name }}] 在线 —— 校验目标系统"
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family in ['Debian', 'Ubuntu', 'RedHat']
    fail_msg: >-
      当前系统 {{ ansible_facts.distribution }} 不在支持列表内。
    quiet: true

- name: "[{{ install_pkg_name }}] 在线 —— 确保基础工具就绪"
  ansible.builtin.include_tasks: "{{ install_base_tasks_dir }}/apt_compat.yml"
  vars:
    _apt_pkgs:
      - curl
      - ca-certificates
      - tar
      - gzip
    _apt_state: present
    _apt_update: true
    _apt_cache_time: 3600

- name: "[{{ install_pkg_name }}] 在线 —— 创建暂存目录"
  ansible.builtin.file:
    path: "{{ install_base_staging_dir }}/{{ install_pkg_name }}"
    state: directory
    mode: "0755"

- name: "[{{ install_pkg_name }}] 在线 —— 下载 nvm release 源码包"
  ansible.builtin.get_url:
    url: "{{ nvm_release_url }}"
    dest: "{{ install_base_staging_dir }}/{{ install_pkg_name }}/nvm-{{ install_pkg_version }}.tar.gz"
    mode: "0644"
    timeout: 300
    checksum: "{{ nvm_release_checksum if nvm_release_checksum | length > 0 else omit }}"
  register: _nvm_get
  retries: 3
  delay: 5
  until: _nvm_get is succeeded

- name: "[{{ install_pkg_name }}] 在线 —— 解压源码包"
  ansible.builtin.unarchive:
    src: "{{ install_base_staging_dir }}/{{ install_pkg_name }}/nvm-{{ install_pkg_version }}.tar.gz"
    dest: "{{ install_base_staging_dir }}/{{ install_pkg_name }}"
    remote_src: true
    extra_opts:
      - --no-same-owner
    creates: "{{ install_base_staging_dir }}/{{ install_pkg_name }}/{{ _nvm_archive_dir_name }}/nvm.sh"

- name: "[{{ install_pkg_name }}] 在线 —— 定位解压后的目录"
  ansible.builtin.stat:
    path: "{{ install_base_staging_dir }}/{{ install_pkg_name }}/{{ _nvm_archive_dir_name }}"
  register: _nvm_srcdir

- name: "[{{ install_pkg_name }}] 在线 —— 校验解压结果"
  ansible.builtin.assert:
    that:
      - _nvm_srcdir.stat.isdir | default(false)
    fail_msg: >-
      源码包解压后未找到目录 {{ _nvm_archive_dir_name }}，
      实际内容：{{ _nvm_srcdir.stat.path }}
    quiet: true

- name: "[{{ install_pkg_name }}] 在线 —— 部署到 nvm_prefix"
  ansible.builtin.shell: |
    set -eu
    SRC="{{ install_base_staging_dir }}/{{ install_pkg_name }}/{{ _nvm_archive_dir_name }}"
    DST="{{ nvm_prefix }}"
    if [ -d "$DST" ]; then
      rm -rf "$DST"
    fi
    mkdir -p "$(dirname "$DST")"
    mv "$SRC" "$DST"
    # 清掉源码包里的 CI/测试产物，减小体积
    rm -rf "$DST/test" "$DST/test-fast" "$DST/.git"
    chmod -R u+rwX,go+rX "$DST"
    echo "DEPLOYED_TO=$DST"
  args:
    executable: /bin/bash
  changed_when: true

- name: "[{{ install_pkg_name }}] 在线 —— 校验 nvm.sh 存在"
  ansible.builtin.stat:
    path: "{{ nvm_prefix }}/nvm.sh"
  register: _nvm_sh

- name: "[{{ install_pkg_name }}] 在线 —— nvm.sh 缺失则失败"
  ansible.builtin.assert:
    that:
      - _nvm_sh.stat.exists | default(false)
    fail_msg: >-
      部署后未找到 {{ nvm_prefix }}/nvm.sh，nvm 安装不完整。
    quiet: true

- name: "[{{ install_pkg_name }}] 在线 —— 生成 /etc/profile.d/nvm.sh"
  ansible.builtin.template:
    src: nvm.sh.j2
    dest: "{{ nvm_profile_file }}"
    mode: "0644"
    force: false

- name: "[{{ install_pkg_name }}] 在线 —— 校验 nvm 可调用"
  ansible.builtin.shell: |
    set -u
    export NVM_DIR="{{ nvm_prefix }}"
    # shellcheck source=/dev/null
    . "{{ nvm_prefix }}/nvm.sh" >/dev/null 2>&1
    nvm --version 2>&1 | head -1
  args:
    executable: /bin/bash
  register: _nvm_verify_out
  changed_when: false
  failed_when: false

- name: "[{{ install_pkg_name }}] 在线 —— 记录实际版本"
  ansible.builtin.set_fact:
    install_pkg_version_actual: >-
      {{ (_nvm_verify_out.stdout | default('')
          | regex_findall('[0-9]+[.][0-9]+[.][0-9]+') | first | default('unknown', true)) }}

- name: "[{{ install_pkg_name }}] 在线 —— 校验失败则中止"
  ansible.builtin.assert:
    that:
      - _nvm_verify_out.rc | default(1) == 0
      - _nvm_verify_out.stdout | default('') | trim | length > 0
    fail_msg: >-
      nvm 安装后无法调用：
      stdout={{ _nvm_verify_out.stdout | default('') }} ｜
      stderr={{ _nvm_verify_out.stderr | default('') }}
    quiet: true

- name: "[{{ install_pkg_name }}] 在线 —— 输出结果"
  ansible.builtin.debug:
    msg: >-
      ✅ nvm 在线安装完成：{{ install_pkg_version_actual }}
      ｜ 位置 {{ nvm_prefix }}
