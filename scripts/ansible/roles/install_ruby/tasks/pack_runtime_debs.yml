---
# =============================================================================
# install_ruby —— source 编译模式的离线包补充件
# =============================================================================
# 打 source 模式的离线包时，目标机是**全新系统**，既没有编译器也没有
# ruby 扩展需要的运行库。两类都必须随包携带：
#
#   1. 编译依赖（ruby_build_packages）：
#      虽然目标机不一定需要重新编译，但 gem install 原生扩展时要 gcc/make。
#      没有它们，`gem install json` 之类会直接失败。
#   2. 运行库（ruby_runtime_packages + ldd 反查）：
#      psych.so 依赖 libyaml-0.so.2 这类库属于系统包，不在 ruby_prefix 内，
#      缺失时 `require "yaml"` 直接抛 LoadError。
#
# 两者都交给 install_base/tasks/collect_deps.yml 统一收集：
#   apt 系 → apt-cache depends + apt-get --print-uris 双路合并 + apt-get download
#   dnf 系 → dnf repoquery --recursive + dnf download
# 包文件类型（.deb / .rpm）由构建机决定，恰好也是目标机需要的类型。
# =============================================================================

- name: "[{{ install_pkg_name }}] 打包准备 —— 按发行版挑选包名"
  ansible.builtin.set_fact:
    _ruby_build_pkgs: >-
      {{ ruby_build_packages if install_base_facts.pkg_mgr == 'apt'
         else ruby_build_packages_dnf }}
    _ruby_runtime_pkgs_wanted: >-
      {{ ruby_runtime_packages if install_base_facts.pkg_mgr == 'apt'
         else ruby_runtime_packages_dnf }}

# -----------------------------------------------------------------------------
# 编译依赖
# -----------------------------------------------------------------------------
- name: "[{{ install_pkg_name }}] 打包准备 —— 选择包管理器任务片段"
  ansible.builtin.set_fact:
    _ruby_pm_tasks: >-
      {{ install_base_tasks_dir ~ '/apt_compat.yml'
         if install_base_facts.pkg_mgr == 'apt'
         else install_base_tasks_dir ~ '/dnf_compat.yml' }}

- name: "[{{ install_pkg_name }}] 打包准备 —— 确保编译依赖已安装"
  ansible.builtin.include_tasks: "{{ _ruby_pm_tasks }}"
  vars:
    _apt_pkgs: "{{ _ruby_build_pkgs }}"
    _apt_update: true
    _dnf_pkgs: "{{ _ruby_build_pkgs }}"
    _dnf_update: true
    # CentOS Stream 8 的 libyaml-devel 只在 PowerTools 仓库，
    # base 找不到时跳过该包而不是整体失败（Psych 缺 YAML 支持不影响 ruby 本体）
    _dnf_skip_unavailable: true
  when: ruby_offline_include_build_debs | bool

- name: "[{{ install_pkg_name }}] 打包准备 —— 收集编译依赖包文件"
  ansible.builtin.include_tasks: "{{ install_base_tasks_dir }}/collect_deps.yml"
  vars:
    _dep_pkg_names: "{{ _ruby_build_pkgs }}"
    _dep_download_dir: "{{ ruby_build_deb_dir }}"
  when: ruby_offline_include_build_debs | bool

- name: "[{{ install_pkg_name }}] 打包准备 —— 输出编译依赖明细"
  ansible.builtin.debug:
    msg: "编译依赖：{{ _dep_result.summary | default('未收集') }}"
  when: ruby_offline_include_build_debs | bool

# -----------------------------------------------------------------------------
# 运行库（当前机器已装的库由 ldd 自动反查，避免写死包名跨版本失配）
# -----------------------------------------------------------------------------
- name: "[{{ install_pkg_name }}] 打包准备 —— 反查扩展模块运行库"
  ansible.builtin.shell: |
    set -u
    EXT_DIR="$(find "{{ ruby_prefix }}/lib" -maxdepth 4 -type d \
                 -name '*linux*' 2>/dev/null | head -1)"
    if [ -z "$EXT_DIR" ] || [ ! -d "$EXT_DIR" ]; then
      echo "pkgs="
      exit 0
    fi
    # 即使当前机器没缺库也要继续，否则「构建机装全、目标机缺库」时会漏库
    MISS_LIBS="$(for so in "$EXT_DIR"/*.so; do
      [ -e "$so" ] || continue
      ldd "$so" 2>/dev/null | awk '/not found/ {print $1}'
    done | sort -u)"
    PKGS=""
    if command -v dpkg >/dev/null 2>&1; then
      for lib in $MISS_LIBS; do
        P="$(dpkg -S "*/$lib" 2>/dev/null | head -1 | cut -d: -f1)"
        [ -n "$P" ] && PKGS="$PKGS $P"
      done
    elif command -v rpm >/dev/null 2>&1; then
      for lib in $MISS_LIBS; do
        P=$(find /usr/lib64 /usr/lib -maxdepth 3 -name "$lib" 2>/dev/null | head -1)
        [ -z "$P" ] && continue
        P="$(rpm -qf "$P" --qf '%{NAME}' 2>/dev/null)"
        [ -n "$P" ] && PKGS="$PKGS $P"
      done
    fi
    PKGS="$PKGS {{ _ruby_runtime_pkgs_wanted | join(' ') }}"
    echo "pkgs=$(echo $PKGS | tr ' ' '\n' | sed '/^$/d' | sort -u | tr '\n' ' ')"
  args:
    executable: /bin/bash
  register: _ruby_runtime_probe
  changed_when: false
  when: ruby_offline_include_runtime_debs | bool

- name: "[{{ install_pkg_name }}] 打包准备 —— 记录运行库清单"
  ansible.builtin.set_fact:
    _ruby_runtime_pkgs: >-
      {{ (_ruby_runtime_probe.stdout | default('')
          | regex_findall('pkgs=([^\n]*)') | first | default('', true)
          | trim | split | reject('equalto', '') | list) }}
  when: ruby_offline_include_runtime_debs | bool

- name: "[{{ install_pkg_name }}] 打包准备 —— 收集运行库包文件"
  ansible.builtin.include_tasks: "{{ install_base_tasks_dir }}/collect_deps.yml"
  vars:
    _dep_pkg_names: "{{ _ruby_runtime_pkgs }}"
    _dep_download_dir: "{{ ruby_runtime_deb_dir }}"
  when:
    - ruby_offline_include_runtime_debs | bool
    - _ruby_runtime_pkgs | default([]) | length > 0

- name: "[{{ install_pkg_name }}] 打包准备 —— 输出运行库明细"
  ansible.builtin.debug:
    msg: "运行库：{{ _dep_result.summary | default('未收集') }}"
  when:
    - ruby_offline_include_runtime_debs | bool
    - _ruby_runtime_pkgs | default([]) | length > 0
