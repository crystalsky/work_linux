---
# =============================================================================
# install_ruby —— 计算后的内部变量
# =============================================================================
# 刻意放在 role 的 tasks 里做 include_vars（见 tasks/resolve.yml），
# 而不是写在这个文件里直接依赖 ruby_install_method 求值。
#
# 原因：role 的 vars/main.yml 优先级高于 playbook vars / extra-vars，
# 若在此处直接写 `{{ [... ] if ruby_install_method == 'source' else [] }}`，
# 用户在命令行 -e ruby_install_method=source 时这些变量会被冻结成 apt 模式的空值。
# 通过 include_vars 在 defaults 合并完成之后求值，才能正确反映最终策略。
# =============================================================================

# 探测命令：能输出 RUBY_VERSION 即视为已安装
_install_probe_cmd: "ruby -e 'print RUBY_VERSION'"

# 离线安装失败时需要回滚的路径
# apt 模式：包管理器自管，由 dpkg 自身处理；不整目录回滚
# source 模式：整棵前缀目录回滚
_install_rollback_paths: >-
  {{ [ruby_prefix] if ruby_install_method == 'source' else [] }}

# 打离线包时要打包的路径
# deb  形态：apt 下载出的 .deb 目录
# tree 形态：ruby_prefix 目录树
_install_pack_sources: >-
  {{ [ruby_deb_download_dir] if ruby_offline_format == 'deb'
     else ([ruby_prefix] +
           ([ruby_runtime_deb_dir] if ruby_offline_include_runtime_debs | bool else [])) }}

_install_pack_exclude:
  - "*/.git/*"
  - "*/build/*"
  - "*/ext/*/*.o"
  - "*/share/ri/*"
  - "*/share/doc/*"
