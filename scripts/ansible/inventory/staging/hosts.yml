# 预发布/测试环境清单
# 两台本机 Docker 沙箱容器：
#   Debian 13   ：../../docker/debian13-sandbox/run.sh   -p 22222
#   Ubuntu 20.04：../../docker/ubuntu20.04-sandbox/run.sh -p 22224
#   CentOS Stream 8：../../docker/centos8-sandbox/run.sh  -p 22225
#     （glibc 2.28，用于验证 rpm 系离线包；官方源已 EOL，镜像内换阿里云 vault）
all:
  children:
    sandbox:
      hosts:
        debian13_sandbox:
          ansible_host: 127.0.0.1
          ansible_port: 22222
          ansible_user: test
          ansible_password: test
          sandbox_os_family: debian
        ubuntu2004_sandbox:
          ansible_host: 127.0.0.1
          ansible_port: 22224
          ansible_user: test
          ansible_password: test
          sandbox_os_family: ubuntu
          # ⚠️ 必须显式指定 Python 3.12：
          #    Ubuntu 20.04 系统 Python 是 3.8，Ansible core 2.20 要求 >= 3.9，
          #    用 /usr/bin/python3 会被直接拒绝（"Ansible requires Python 3.9 or newer"）。
          #    镜像里 uv 装的 3.12 满足要求；但它没有 python3-apt（apt_pkg 是
          #    cpython-38 ABI 的 .so），所以 apt 操作一律走
          #    roles/install_base/tasks/apt_compat.yml（apt-get 命令行实现）。
          ansible_python_interpreter: /opt/python/bin/python3
        centos8_sandbox:
          ansible_host: 127.0.0.1
          ansible_port: 22226
          ansible_user: test
          ansible_password: test
          sandbox_os_family: centos
          # ⚠️ 系统 python3 是 3.6.8，Ansible 2.20 要求 >= 3.9；
          #    镜像额外装了 python39 供 Ansible 使用。
          #    但 dnf 的 python 绑定只有 3.6 版本，所以包管理一律走
          #    roles/install_base/tasks/dnf_compat.yml（dnf 命令行实现）。
          ansible_python_interpreter: /usr/bin/python3.9
